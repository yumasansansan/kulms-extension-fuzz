version = 1

[[annotations]]
path = ["package.json", "pnpm-lock.yaml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yuma Kakei <yumasansansan@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Inputs of the fuzz targets (fuzz/README.md): the seeds; the inputs that once
# made a target fail and pass since its fix; the inputs that fail while a
# finding of docs/findings.md stands, all of which fuzz/inputs.mjs writes from
# the values written out in it; and the input the canary must fail on. They
# hold no one's data.
[[annotations]]
path = ["fuzz/seeds/**", "fuzz/regressions/**", "fuzz/known/**", "fuzz/canary/planted-input"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yuma Kakei <yumasansansan@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
